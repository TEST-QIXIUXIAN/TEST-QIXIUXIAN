      <h1>你好，博客XIU</h1>
      <time class="post-meta" datetime="2026-09-27">2026-09-27</time>

      <p>这是博客XIU 的第一篇文章，也是诺尔曼开始认真记录的第一天。</p>

      <h2>为什么要写下来</h2>
      <p>灵感来得快，走得也快。走路时的一个念头、读书时的一句触动、深夜里忽然想通的一件事，如果不记下来，第二天就只剩下“好像想到过什么”。</p>
      <p>所以有了这里：一个安放灵感与感悟的地方。</p>

      <h2>这里会写什么</h2>
      <ul>
        <li><strong>灵感</strong>：零碎的想法、突然冒出来的点子</li>
        <li><strong>感悟</strong>：从经历里慢慢沉淀下来的体会</li>
        <li><strong>随笔</strong>：没有主题，只是想写</li>
      </ul>

      <p>不求写得多，只求写得真。</p>
